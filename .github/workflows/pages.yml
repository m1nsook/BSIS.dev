name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsis-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Export static site
        run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /BSIS.dev
      - name: Verify exported entry points
        run: |
          test -f out/index.html
          test -f out/docs/index.html
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
